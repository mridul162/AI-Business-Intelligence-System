[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-business-intelligence-system"
version = "0.1.0"
description = "AI-powered business intelligence system for natural-language analytical queries."
requires-python = ">=3.14,<4.0"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.141,<1.0",
    "httpx2>=2.12,<3.0",
    "openai",
    "pydantic-settings",
    "uvicorn[standard]>=0.35,<1.0",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "database*",
    "etl*",
    "evaluation*",
]