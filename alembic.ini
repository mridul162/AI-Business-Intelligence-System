[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally omitted here — the real URL is built
# from AIBI_DB_* environment variables in database/migrations/env.py,
# so the same alembic.ini works unchanged across dev/CI/production.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
